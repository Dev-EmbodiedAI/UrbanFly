[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-wm-navigation"
version = "0.1.0"
description = "World-model-augmented YOPO navigation for UrbanFly"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "torch>=2.1",
  "opencv-contrib-python>=4.8",
  "PyYAML>=6.0",
  "ruamel.yaml>=0.18",
  "h5py>=3.12",
  "matplotlib>=3.7",
  "pandas>=2.0",
  "aiohttp>=3.9",
]

[project.optional-dependencies]
test = ["pytest>=7.0", "scikit-learn>=1.3"]
data = ["pyarrow>=18.0", "pandas>=2.2.3,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
