format: hdf5-v2
map: Town10HD
sensor_hz: 10
planner_hz: 5
control_hz: 20
rgb_hz: 2
episode_duration_s: 40
future_horizon: 5
history: 4
require_real_yopo: true
required_candidate_count: 15
seed: 1000
stages: {calibration: 12, pilot: 48, train: 240, validation: 60, test: 60}
scenarios: [StreetCanyon, IntersectionTurn, OccludedCrossing, DynamicCrossing, NarrowPassage, DenseMixedUrban]
difficulties: [easy, medium, hard]
behavior_policy: {yopo_argmin: 0.50, safe_topk: 0.25, hard_negative: 0.15, ttc_guided: 0.10}
quality_gates:
  depth_valid_rate_min: 0.95
  body_mask_contamination_max: 0.005
  sensor_state_skew_p95_ms_max: 20
  dynamic_replay_agreement_min: 0.95
  max_selected_lattice_fraction: 0.35
  dangerous_candidate_fraction: [0.10, 0.25]
